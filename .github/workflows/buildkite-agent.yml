# A Buildkite agent on a GitHub-hosted runner, for jobs of Fluffy's own CI
# (the gha queue).  Started when jobs are waiting; the agent takes them
# back to back and ends after 2 idle minutes.  GitHub's terms allow GitHub-hosted
# runners for "the production, testing, deployment, or publication of the
# software project" of the repository: this builds, tests and publishes
# Fluffy, and nothing else.
name: buildkite-agent

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Buildkite jobs, until idle
        env:
          BUILDKITE_AGENT_TOKEN: ${{ secrets.BUILDKITE_AGENT_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -o /tmp/gha-agent.sh \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/ci/gha-agent.sh"
          bash /tmp/gha-agent.sh

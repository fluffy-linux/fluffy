# Buildkite agents on GitHub-hosted runners, for Fluffy's own CI (the gha
# queue).  GitHub's terms allow GitHub-hosted runners for "the production,
# testing, deployment, or publication of the software project" of the
# repository: this builds, tests and publishes Fluffy, and nothing else.
#
# Two jobs:
# - scaler, on a push and every 15 minutes (for a retried job or a build
#   started in Buildkite), one per branch (its concurrency group): it
#   starts agent runs of this workflow while gha has jobs waiting, at most
#   4 at once, and ends when the queue has been quiet for 5 minutes
#   (ci/gha-scaler.py).  The only job that may start workflows.
# - agent, on workflow_dispatch (what the scaler starts): a runner set up
#   as the GCP agents are, taking gha's jobs back to back until 2 idle
#   minutes (ci/gha-agent.sh).
name: buildkite-agent

on:
  push:
    branches: ["🐶"]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions: {}

jobs:
  scaler:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    concurrency:
      group: scaler-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - name: Start agent runs while jobs wait
        env:
          BUILDKITE_AGENT_TOKEN: ${{ secrets.BUILDKITE_AGENT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -o /tmp/gha-scaler.py \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/ci/gha-scaler.py"
          python3 -I /tmp/gha-scaler.py

  agent:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    steps:
      - name: Buildkite jobs, until idle
        env:
          BUILDKITE_AGENT_TOKEN: ${{ secrets.BUILDKITE_AGENT_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -o /tmp/gha-agent.sh \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/ci/gha-agent.sh"
          bash /tmp/gha-agent.sh

# The boot test's grub.cfg (boot-test.sh), not a machine's: its image's
# btrfs file system and root partition are made with these IDs, and the
# kernel's version is world's linux (boot-test.sh checks both).  A serial
# console, where the test watches for login:.  The consoles' terminal type
# and size are given (systemd.tty.*): otherwise systemd and agetty ask the
# terminal (DSR, terminfo) and wait about 0.33 s per question for answers a
# serial log never gives, about 2 s of the boot (measured 2026-11-26).
set default=0
set timeout=1

serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

insmod btrfs
insmod part_gpt

search --no-floppy --fs-uuid --set=root a3affbd1-ec89-426a-928b-0c82041ecc92

menuentry "Fluffy Linux 7.1.8 (boot test)" {
    insmod loopback
    insmod squash4
    loopback loop0 /@/sw/linux-7.1.8.squashfs
    linux (loop0)/boot/vmlinuz-7.1.8 root=PARTUUID=85710030-2128-4c64-a2b3-03fb204ba1c2 rootflags=subvol=@ init=/init ro console=tty0 console=ttyS0,115200 systemd.tty.term.console=vt220 systemd.tty.rows.console=24 systemd.tty.columns.console=80 systemd.tty.term.ttyS0=vt220 systemd.tty.rows.ttyS0=24 systemd.tty.columns.ttyS0=80
}

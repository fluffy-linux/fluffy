# The boot test's grub.cfg (boot-test.sh), not a machine's: its image's
# btrfs file system and root partition are made with these IDs, and the
# kernel's version is world's linux (boot-test.sh checks both).  A serial
# console, where the test watches for login:.
set default=0
set timeout=1

serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

insmod btrfs
insmod part_gpt

search --no-floppy --fs-uuid --set=root a3affbd1-ec89-426a-928b-0c82041ecc92

menuentry "Fluffy Linux 7.1.8 (boot test)" {
    insmod loopback
    insmod squash4
    loopback loop0 /@/sw/linux-7.1.8.squashfs
    linux (loop0)/boot/vmlinuz-7.1.8 root=PARTUUID=85710030-2128-4c64-a2b3-03fb204ba1c2 rootflags=subvol=@ init=/init ro console=tty0 console=ttyS0,115200
}

set default=0
set timeout=5

insmod btrfs
insmod part_gpt

# Initialize graphical video drivers
set gfxmode=3840x2160x32,auto

insmod video
insmod font
insmod gfxterm
terminal_output gfxterm

# Load a larger font for the GRUB interface
font /boot/grub/fonts/djsans64.pf2

# DYNAMIC SEARCH: This finds the drive containing your LFS partition by its UUID
# and assigns it to the 'root' variable automatically, bypassing the need for "hd0".
search --no-floppy --fs-uuid --set=root 103b03ca-d079-46fe-8bdc-eab2518e63c7

menuentry "Linux From Scratch 13.1 (native)" {
    linux /boot/vmlinuz-7.1.8-lfs-13.1-systemd root=UUID=103b03ca-d079-46fe-8bdc-eab2518e63c7 rootflags=device=UUID=103b03ca-d079-46fe-8bdc-eab2518e63c7 ro
}

menuentry "Linux From Scratch 13.1 (libvirt)" {
    linux /boot/vmlinuz-7.1.8-lfs-13.1-systemd root=/dev/sda1 ro quiet
}

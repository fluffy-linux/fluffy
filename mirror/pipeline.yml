# The mirror pipeline (NOTES.md, "Mirror sync"): its first step prints one
# sync step per fluffy-linux repository and uploads them.  Runs on the
# mirror agent, whose environment names the repositories disk and the push
# token (the mirror agent, to be set up on GCP like the build agents in
# infra/; its Azure version is in the git history).  Scheduled in Buildkite.
steps:
  - label: "plan"
    command: "./mirror/mirror dag | buildkite-agent pipeline upload"
    agents:
      queue: "mirror"

# Fluffy's additions to buildkite-agent.service.
[Unit]
# Only on a CI agent VM: the scale set's custom data writes this file.
ConditionPathExists=/etc/fluffy-ci/agent.env
Wants=network-online.target
After=network-online.target
# A failed start or a crash is retried (below), at most 5 times in 15
# minutes; after that the unit stays failed and the VM is kept, visibly,
# for a person to look at.
StartLimitIntervalSec=900
StartLimitBurst=5

[Service]
EnvironmentFile=/etc/fluffy-ci/agent.env
# Fetch the agent token from Key Vault into /run before starting.
ExecStartPre=+/usr/local/sbin/fluffy-ci-agent-token
# When the agent exits because it was idle (a clean exit), delete this
# VM; on any other stop the script keeps it.
ExecStopPost=+/usr/local/sbin/fluffy-ci-self-delete
# Retry a failed start or a crash instead of leaving an idle VM that
# never became an agent.  A clean exit is not restarted, so the idle
# self-delete still happens, and a stop (shutdown, eviction) never is.
Restart=on-failure
RestartSec=30

# Fluffy's CI agent.  The queue comes from BUILDKITE_AGENT_QUEUE in
# /etc/fluffy-ci/agent.env (set per scale set); the token is written at
# boot, from Key Vault, by fluffy-ci-agent-token.
token="file:///run/fluffy-ci/agent-token"
name="%hostname-%spawn"
build-path="/var/lib/buildkite-agent/builds"
hooks-path="/etc/buildkite-agent/hooks"
plugins-path="/etc/buildkite-agent/plugins"

# Take jobs back to back while the queue has them; after 10 minutes with
# none, exit, and the VM deletes itself (fluffy-ci-self-delete).
disconnect-after-idle-timeout=600

#cloud-config
# Makes a VM booted from the agent image (infra/packer) a CI agent for
# one queue.  GCP's Ubuntu images run cloud-init from the user-data
# metadata key, which the instance template sets to this file.
write_files:
  # Written under another name and renamed at the end of runcmd: on GCP,
  # write_files runs before systemd starts the agent unit, which would then
  # start (its condition, agent.env, met) before /mnt is ready.
  - path: /etc/fluffy-ci/agent.env.new
    permissions: "0644"
    content: |
      BUILDKITE_AGENT_QUEUE=${queue}
      FLUFFY_CI_PROJECT=${project}
      FLUFFY_CACHE_REGISTRY=${cache_registry}
      FLUFFY_CACHE_TOKEN_FILE=/run/fluffy-ci/ghcr-token
      BUILDKITE_BUILD_PATH=/mnt/buildkite/builds
  - path: /usr/local/sbin/fluffy-ci-local-disk
    permissions: "0755"
    content: |
      #!/bin/bash
      # Mounts the VM's local NVMe SSD on /mnt: it comes blank, so it is
      # formatted first.  With several, the first (builds fit on one).
      set -eu
      mountpoint -q /mnt && exit 0
      for dev in /dev/disk/by-id/google-local-nvme-ssd-0 /dev/disk/by-id/google-local-ssd-0
      do
          if test -e "$dev"
          then
              mkfs.ext4 -q -F -L fluffy-local "$dev"
              mkdir -p /mnt
              mount "$dev" /mnt
              exit 0
          fi
      done
      echo "fluffy-ci-local-disk: no local SSD; builds stay on the boot disk"

# Builds run on the local SSD, much faster than the network-attached boot
# disk.  On it: the pipeline's FLUFFY root, /mnt/ci (bootstrap.sh mounts
# $FLUFFY from /etc/fstab when it is not already a mount point, so it is a
# bind mount of itself), and the Buildkite checkouts, where swctl's work/
# lives (BUILDKITE_BUILD_PATH above).  Then start the agent: its unit only
# starts once agent.env exists, put in place here, after systemd has
# already skipped it at boot.
runcmd:
  - /usr/local/sbin/fluffy-ci-local-disk
  - mkdir -p /mnt/ci /mnt/buildkite/builds
  - chown buildkite-agent:buildkite-agent /mnt/buildkite /mnt/buildkite/builds
  - grep -q ' /mnt/ci ' /etc/fstab || echo '/mnt/ci /mnt/ci none bind 0 0' >> /etc/fstab
  - mountpoint -q /mnt/ci || mount /mnt/ci
  - mv /etc/fluffy-ci/agent.env.new /etc/fluffy-ci/agent.env
  - systemctl start buildkite-agent

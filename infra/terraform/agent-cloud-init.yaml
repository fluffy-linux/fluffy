#cloud-config
# Makes a VM booted from the agent image a CI agent for one queue.
write_files:
  - path: /etc/fluffy-ci/agent.env
    permissions: "0644"
    content: |
      BUILDKITE_AGENT_QUEUE=${queue}
      FLUFFY_CI_KEY_VAULT=${key_vault}
      FLUFFY_CI_IDENTITY_CLIENT_ID=${identity_client_id}

# The pipeline's FLUFFY root.  bootstrap.sh mounts $FLUFFY from /etc/fstab
# when it is not already a mount point, so it is a bind mount of itself,
# on the OS disk.
bootcmd:
  - mkdir -p /mnt/ci
  - grep -q ' /mnt/ci ' /etc/fstab || echo '/mnt/ci /mnt/ci none bind 0 0' >> /etc/fstab
  - mountpoint -q /mnt/ci || mount /mnt/ci

# The agent's unit only starts once agent.env exists, which write_files
# runs after systemd has already skipped it at boot.
runcmd:
  - systemctl start buildkite-agent

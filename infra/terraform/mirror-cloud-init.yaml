#cloud-config
# Makes a VM booted from the agent image the mirror agent: attaches the
# persistent repositories disk, mounts it on /srv/mirror, fetches the
# GitHub push token, and starts the agent with 4 job slots on the mirror
# queue.  (The build agents' setup is agent-cloud-init.yaml.)
write_files:
  - path: /etc/fluffy-ci/agent.env
    permissions: "0644"
    content: |
      BUILDKITE_AGENT_QUEUE=${queue}
      BUILDKITE_AGENT_SPAWN=4
      FLUFFY_CI_KEY_VAULT=${key_vault}
      FLUFFY_CI_IDENTITY_CLIENT_ID=${identity_client_id}
      FLUFFY_MIRROR_DIR=/srv/mirror/repos
      FLUFFY_MIRROR_TOKEN_FILE=/run/fluffy-ci/github-mirror-token
  - path: /usr/local/sbin/fluffy-ci-mirror-disk
    permissions: "0755"
    content: |
      #!/bin/bash
      # Attaches the mirror repositories disk to this VM (it is detached,
      # not deleted, when a VM is deleted, so it outlives each agent),
      # formats it only if it is blank (its first use), and mounts it on
      # /srv/mirror.  Azure's API, with the VM's managed identity.
      set -euo pipefail
      . /etc/fluffy-ci/agent.env
      disk_id='${disk_id}'
      imds=http://169.254.169.254/metadata
      token() {
          local resource=$1 reply
          for attempt in $(seq 1 40)
          do
              if reply=$(curl -fsS -H Metadata:true "$imds/identity/oauth2/token?api-version=2018-02-01&resource=$resource&client_id=$FLUFFY_CI_IDENTITY_CLIENT_ID")
              then
                  printf '%s' "$reply" | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])' && return 0
              fi
              sleep 3
          done
          echo "fluffy-ci-mirror-disk: no identity token" >&2
          return 1
      }
      dev=/dev/disk/azure/scsi1/lun0
      if test ! -e "$dev"
      then
          vm_id=$(curl -fsS -H Metadata:true "$imds/instance/compute/resourceId?api-version=2021-02-01&format=text")
          arm=$(token https%3A%2F%2Fmanagement.azure.com%2F)
          body=$(printf '{"properties":{"storageProfile":{"dataDisks":[{"lun":0,"createOption":"Attach","caching":"ReadOnly","managedDisk":{"id":"%s"}}]}}}' "$disk_id")
          # A previous VM's detach can still be finishing: retry.
          for attempt in $(seq 1 30)
          do
              if curl -fsS -X PATCH -H "Authorization: Bearer $arm" -H 'Content-Type: application/json' \
                  -d "$body" "https://management.azure.com$vm_id?api-version=2024-07-01" > /dev/null
              then
                  break
              fi
              sleep 10
          done
          for attempt in $(seq 1 60)
          do
              test -e "$dev" && break
              sleep 5
          done
      fi
      test -e "$dev" || { echo "fluffy-ci-mirror-disk: the disk did not appear" >&2; exit 1; }
      dev=$(readlink -f "$dev")
      if ! blkid "$dev" > /dev/null
      then
          mkfs.ext4 -q -L fluffy-mirror "$dev"
      fi
      mkdir -p /srv/mirror
      mountpoint -q /srv/mirror || mount "$dev" /srv/mirror
      mkdir -p /srv/mirror/repos
      chown buildkite-agent:buildkite-agent /srv/mirror/repos

      # The GitHub push token, readable by the agent's jobs only.
      vault=$(token https%3A%2F%2Fvault.azure.net)
      install -d -m 700 -o buildkite-agent -g buildkite-agent /run/fluffy-ci
      ( umask 077
        curl -fsS --retry 5 -H "Authorization: Bearer $vault" \
            "https://$FLUFFY_CI_KEY_VAULT.vault.azure.net/secrets/github-mirror-token?api-version=7.4" \
        | python3 -c 'import json, sys; sys.stdout.write(json.load(sys.stdin)["value"].strip())' \
            > "$FLUFFY_MIRROR_TOKEN_FILE" ) || echo "fluffy-ci-mirror-disk: no github-mirror-token in the vault; pushes will fail"
      chown buildkite-agent:buildkite-agent "$FLUFFY_MIRROR_TOKEN_FILE" 2>/dev/null || true

# Attach and mount the disk, then start the agent (its unit only starts
# once agent.env exists, which write_files creates after systemd has
# already skipped it).
runcmd:
  - /usr/local/sbin/fluffy-ci-mirror-disk
  - systemctl start buildkite-agent

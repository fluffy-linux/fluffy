env:
  FLUFFY: /mnt/ci
  CROSS: "1"

steps:
  - label: "plan"
    command: |
      set -euo pipefail
      sudo FLUFFY="$$FLUFFY" ./bootstrap.sh
      plan="$$(mktemp)"
      sudo FLUFFY="$$FLUFFY" CROSS="$$CROSS" ./swctl buildkite world > "$$plan"
      buildkite-agent pipeline upload "$$plan"
      rm -f "$$plan"

  - wait

  - label: "bootstrap"
    command: sudo FLUFFY="$$FLUFFY" ./bootstrap.sh
